[package]
edition      = "2024"
name         = "smart-light-controller"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "Smart-light-controller"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dhcpv4-hostname",
  "dns",
  "icmp",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-futures = "0.1.2"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-storage = { version = "0.10.0", features = ["esp32s3", "embedded-storage"] }
embedded-storage = "0.3.2"
# for more networking protocol support see https://crates.io/crates/edge-net
bt-hci = "0.9.0"
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "coex",
  "esp-alloc",
  "esp32s3",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
trouble-host = { version = "0.7.0", features = ["gatt"] }

critical-section = "1.2.0"
esp-backtrace    = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-hal-smartled = { version = "0.18.0", features = ["esp32s3"] }
esp-println      = { version = "0.18.0", features = ["esp32s3"] }
smart-leds       = "0.4.0"
static_cell      = "2.1.1"
reqwless         = { version = "0.14.0", default-features = false, features = ["embedded-tls", "alloc"] }
embedded-tls     = { version = "0.18.0", default-features = false, features = ["alloc"] }
serde            = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json       = { version = "1.0", default-features = false, features = ["alloc"] }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
